<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GlamNest – Jewellery &amp; Accessories</title>
<style>
:root{--bg:#fff8f6;--card:#fff;--tx:#2a1f24;--mu:#7a6a70;--ac:#d6336c;--bd:#f0dde2;--ok:#2b8a3e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1216;--card:#261b21;--tx:#f7eef1;--mu:#b9a5ad;--bd:#3a2a32}}
:root[data-theme="dark"]{--bg:#1a1216;--card:#261b21;--tx:#f7eef1;--mu:#b9a5ad;--bd:#3a2a32}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--card);border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;padding:12px 16px;z-index:5}
.logo{cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation;font-weight:800;font-size:20px;color:var(--ac)}
button,select,input{font:inherit;color:inherit}
.btn{background:var(--ac);color:#fff;border:0;padding:9px 16px;border-radius:10px;cursor:pointer;font-weight:600}
.btn.o{background:none;border:1px solid var(--bd);color:var(--tx)}
.btn.s{padding:5px 10px;font-size:13px}
main{max-width:1000px;margin:0 auto;padding:16px}
.hero{background:linear-gradient(135deg,#d6336c,#f59f00);color:#fff;border-radius:16px;padding:22px;margin-bottom:16px}
.hero h1{margin:0 0 6px;font-size:24px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 0 12px}
.chip{border:1px solid var(--bd);background:var(--card);padding:6px 14px;border-radius:99px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
h2{font-size:17px;margin:14px 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden}
.img{height:110px;display:flex;align-items:center;justify-content:center;font-size:48px;background:linear-gradient(135deg,#ffe3ec,#fff0c9);position:relative}
.tag{position:absolute;top:6px;left:6px;background:var(--ac);color:#fff;font-size:11px;padding:2px 7px;border-radius:99px}
.info{padding:10px}.info b{display:block;font-size:14px}
.pr{margin:4px 0 8px}.pr s{color:var(--mu);font-size:12px;margin-left:4px}
.card .btn{width:100%}.img img{width:100%;height:100%;object-fit:cover}.ban{background:#fff3bf;color:#5c4a00;border-radius:10px;padding:10px;margin-bottom:10px}.thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;vertical-align:middle}
.panel{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}
.panel.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:520px;max-height:90%;overflow:auto;border-radius:18px 18px 0 0;padding:18px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0}
input,select{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);margin:4px 0}
label.pay{display:flex;gap:10px;align-items:center;border:1px solid var(--bd);border-radius:10px;padding:8px 10px;margin:6px 0;cursor:pointer}
label.pay input{width:auto;margin:0}
.tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}.stat b{font-size:22px;display:block}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
.mu{color:var(--mu);font-size:13px}footer{text-align:center;padding:24px;color:var(--mu);font-size:13px}
a{color:var(--ac)}
.hero.hasimg{position:relative;overflow:hidden;padding:0;background:#222}
.hs{position:absolute;inset:0}.hs img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .9s}.hs img.on{opacity:1}
.ht{position:relative}.hero.hasimg .ht{min-height:210px;display:flex;flex-direction:column;justify-content:flex-end;padding:20px;background:linear-gradient(transparent 25%,rgba(0,0,0,.72))}
.hero.hasimg h1{text-shadow:0 1px 6px rgba(0,0,0,.5)}
.card{cursor:pointer}.nv{position:absolute;top:50%;transform:translateY(-50%);border:0;background:rgba(0,0,0,.45);color:#fff;font-size:24px;width:34px;height:46px;cursor:pointer}.nv.l{left:0;border-radius:0 8px 8px 0}.nv.r{right:0;border-radius:8px 0 0 8px}
.th,.th2{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}.th img{width:52px;height:52px;object-fit:cover;border-radius:8px;border:2px solid transparent;cursor:pointer}.th img.on{border-color:var(--ac)}
.ti{position:relative;width:64px;height:64px;border-radius:10px;overflow:hidden;border:1px solid var(--bd);display:inline-flex;align-items:center;justify-content:center}.ti img{width:100%;height:100%;object-fit:cover}.ti button{position:absolute;top:0;right:0;border:0;background:rgba(0,0,0,.6);color:#fff;width:20px;height:20px;cursor:pointer}.ti.add{font-size:28px;color:var(--ac);cursor:pointer}
textarea.t{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:inherit;margin:4px 0;font:inherit}.pdesc{white-space:pre-wrap;margin:8px 0}
.grid{align-items:stretch}.card{display:flex;flex-direction:column}.card .info{display:flex;flex-direction:column;flex:1}.card .info>b{min-height:2.6em;line-height:1.3em;overflow:hidden}.card .info .btn{margin-top:auto}
.coh{display:flex;align-items:center;gap:10px;font-size:18px;margin-bottom:6px}.bk{border:0;background:none;font-size:24px;color:inherit;cursor:pointer;padding:0 6px}
.cos{border-bottom:1px solid var(--bd);padding:10px 0}.cot{font-size:12px;font-weight:700;color:var(--mu);letter-spacing:.6px;margin-bottom:6px}
.lnk{border:0;background:none;color:var(--ac);font-weight:700;cursor:pointer;padding:6px 0}
.bl{display:flex;justify-content:space-between;padding:3px 0}.bl.t{border-top:1px solid var(--bd);margin-top:6px;padding-top:8px;font-weight:800;font-size:17px}
.upis{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.upis a{text-decoration:none;text-align:center}
label.pay span b{display:block}
.tl{margin:6px 0}.st{display:flex;gap:10px;align-items:center;padding:4px 0}.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--bd);display:inline-flex;align-items:center;justify-content:center;font-size:12px;flex:none}.st.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}.trk.bad{color:#e03131;font-weight:700;padding:6px 0}.btn.wa{background:#25d366;color:#fff}
</style>

function saveP(){

  if(!can("prod_edit")) return;

  const p = AP_p;

  p.name = $('e_n').value.trim();

  if(!p.name){
    alert("Name required");
    return;
  }

  p.cat = $('e_c').value;
  p.price = +$('e_p').value;
  p.mrp = +$('e_m').value || p.price;

  if(!$('e_s').disabled){

    const v = +$('e_s').value || 0;

    p.open = v;
    p.base = v;
    p.stock = v;

    // Tell Firebase this product must be written
    p._st = 1;
  }

  p.emoji = $('e_e').value || '✨';

  p.desc = $('e_d')
    ? $('e_d').value.trim()
    : (p.desc || '');

  const h = $('e_h').value;

  if(h){
    p.sec = h;
  }else{
    delete p.sec;
  }

  delete p.trend;

  if(p.isNew){

    delete p.isNew;

    S.products.push(p);

    if(p.stock){
      mvAdd(
        p,
        p.stock,
        'Purchase',
        'Opening stock'
      );
    }
  }

  recalc();

  // ONLY mark as changed.
  // It does NOT save automatically.
  dirty = true;

  closeP();

  render();
}

function slide(){const h=document.getElementById('hs');if(!h||h.children.length<2)return;const a=[...h.children],i=a.findIndex(x=>x.classList.contains('on'));a[i].classList.remove('on');a[(i+1)%a.length].classList.add('on')}

function card(p){return `<div class="card" onclick="preview(${p.id})"><div class="img">${pic(p)}${p.stock<=5&&p.stock>0?`<span class="tag">Only ${p.stock} left</span>`:p.sec==='trend'?'<span class="tag">🔥 Trending</span>':''}</div><div class="info"><b>${esc(p.name)}</b><div class="pr"><b style="display:inline">${inr(p.price)}</b><s>${inr(p.mrp)}</s></div><button class="btn s" ${p.stock<1?'disabled':''} onclick="event.stopPropagation();preview(${p.id})">${p.stock<1?'Sold out':'View & add'}</button></div></div>`}
function shop(){const l=S.products.filter(p=>!p.off&&(cat==='All'||p.cat===cat));
return hero()+S.sections.map(s=>{const t=S.products.filter(p=>p.sec===s.id&&!p.off);return t.length?`<h2>${esc(s.title)}</h2><div class="grid">${t.map(card).join('')}</div>`:''}).join('')+`<h2>${esc(C().allTitle)}</h2><div class="chips">${cats().map(c=>`<span class="chip ${c===cat?'on':''}" onclick="cat='${c}';render()">${c}</span>`).join('')}</div><div class="grid">${l.map(card).join('')||'<p class="mu">Nothing here yet.</p>'}</div>`}
function preview(id,i){const p=P(id);if(!p)return;pvI=i||0;const im=imgsOf(p);
openP(`<div class="img" style="height:260px;border-radius:12px;position:relative">${im.length?`<img id="pvm" src="${im[pvI]}" style="object-fit:contain" alt="">`:`<span style="font-size:90px">${p.emoji}</span>`}${im.length>1?`<button class="nv l" onclick="pvGo(${id},-1)">‹</button><button class="nv r" onclick="pvGo(${id},1)">›</button>`:''}</div>${im.length>1?`<div class="th">${im.map((u,k)=>`<img src="${u}" class="${k===pvI?'on':''}" onclick="preview(${id},${k})" alt="">`).join('')}</div>`:''}
<h2 style="margin:10px 0 2px">${esc(p.name)}</h2><div class="pr"><b>${inr(p.price)}</b><s>${inr(p.mrp)}</s></div>${p.desc?`<p class="pdesc">${esc(p.desc)}</p>`:''}<div class="mu">${p.stock>0?(p.stock<=5?'Only '+p.stock+' left':'In stock'):'Sold out'}</div>
<button class="btn" style="width:100%;margin-top:8px" ${p.stock<1?'disabled':''} onclick="add(${id})">${p.stock<1?'Sold out':'Add to cart'}</button><button class="btn o" style="width:100%;margin-top:6px" onclick="closeP()">Close</button>`)}
function pvGo(id,d){const n=imgsOf(P(id)).length;preview(id,(pvI+d+n)%n)}
function success(id,T,m,msg){const upi=m==='upi'?`<a class="btn" style="display:block;text-align:center;margin:6px 0;text-decoration:none" href="upi://pay?pa=${encodeURIComponent(C().upiId)}&pn=${encodeURIComponent(C().name)}&am=${T}&cu=INR&tn=${id}">1. Pay ${inr(T)} with UPI app</a>`:'';
openP(`<h2>🎉 Order placed!</h2><p>Order <b>${id}</b> · ${inr(T)}</p>${FB?'<p class="mu">Your order has been recorded.</p>':''}${upi}<a class="btn" style="display:block;text-align:center;text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/${C().wa}?text=${encodeURIComponent(msg)}">${upi?'2. ':''}Send order on WhatsApp</a><p class="mu">${FB?'Optional: share it on WhatsApp for faster confirmation.':'Please send the order message so we can confirm and ship it.'}</p>${FB?'<button class="btn o" style="width:100%;margin-bottom:6px" onclick="openTrack()">📦 Track this order</button>':''}<button class="btn o" style="width:100%" onclick="closeP()">Continue shopping</button>`)}
function shrink(f,max,q){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,im.width*k);c.height=Math.max(1,im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};im.onerror=()=>res(null);im.src=r.result};r.readAsDataURL(f)})}
const thumbs=(a,rm)=>a.map((u,i)=>`<span class="ti"><img src="${u}" alt=""><button onclick="${rm}(${i})">✕</button></span>`).join('');
const imgMgr=()=>{const a=imgsOf(AP_p);return thumbs(a,'rmImg')+(a.length<MAXI?'<label class="ti add">＋<input type="file" accept="image/*" multiple style="display:none" onchange="addImgs(this)"></label>':'')+`<div class="mu" style="width:100%">${a.length}/${MAXI} photos · first photo is the main one</div>`};
async function addImgs(inp){const p=AP_p;p.imgs=imgsOf(p).slice();delete p.img;const msg=$('imgmsg');msg.textContent='';
for(const f of [...inp.files]){if(p.imgs.length>=MAXI){msg.textContent='Maximum '+MAXI+' photos.';break}const u=await shrink(f,700,.7);if(!u)continue;p.imgs.push(u);if(JSON.stringify(p).length>900000){p.imgs.pop();msg.textContent='That photo is too large for one item. Try a smaller photo.';break}}
ch();$('pimgs').innerHTML=imgMgr()}
function rmImg(i){AP_p.imgs=imgsOf(AP_p).slice();AP_p.imgs.splice(i,1);delete AP_p.img;ch();$('pimgs').innerHTML=imgMgr()}
function editP(id){if(!can("prod_edit"))return;AP_p=id?P(id):{id:Date.now(),name:'',cat:'Earrings',price:0,mrp:0,stock:0,open:0,emoji:'✨',isNew:1};const p=AP_p;AP_o=p.stock;
openP(`<h2>${id?'Edit':'New'} product</h2><span class="mu">Photos (up to ${MAXI})</span><div id="pimgs" class="th2">${imgMgr()}</div><div id="imgmsg" class="mu" style="color:#e03131"></div>
<span class="mu">Name</span><input id="e_n" value="${esc(p.name)}"><span class="mu">Category</span><select id="e_c">${cats().slice(1).map(c=>`<option ${c===p.cat?'selected':''}>${c}</option>`).join('')}</select>
<span class="mu">📝 Description — shown below the photo when a customer opens the item</span><textarea id="e_d" class="t" rows="4" placeholder="Material, size, colour, care instructions...">${esc(p.desc||'')}</textarea>
<span class="mu">Selling price ₹</span><input id="e_p" type="number" value="${p.price}"><span class="mu">MRP ₹</span><input id="e_m" type="number" value="${p.mrp}"><span class="mu">Opening stock (set once)</span><input id="e_s" type="number" value="${p.open??p.stock}" ${used(p.id)?'disabled':''}><div class="mu">${used(p.id)?'Locked — this item already has entries. Stock now changes only through Purchase, Sale and Wastage entries.':'Enter the stock you already have today. After this, add new stock under Entries → Purchase.'}</div>
<span class="mu">Emoji (used if no photo)</span><input id="e_e" value="${p.emoji}"><span class="mu">Show under heading</span><select id="e_h"><option value="">— none —</option>${S.sections.map(s=>`<option value="${s.id}" ${s.id===p.sec?'selected':''}>${esc(s.title)}</option>`).join('')}</select>
<button class="btn" style="width:100%;margin-top:8px" onclick="saveP()">Save</button><button class="btn o" style="width:100%;margin-top:6px" onclick="closeP()">Cancel</button>`)}
const heroMgr=()=>{const a=C().hero||[];return thumbs(a,'rmHero')+(a.length<MAXI?'<label class="ti add">＋<input type="file" accept="image/*" multiple style="display:none" onchange="addHero(this)"></label>':'')+`<div class="mu" style="width:100%">${a.length}/${MAXI} banner images</div>`};
async function addHero(inp){const c=C();c.hero=(c.hero||[]).slice();const msg=$('himsg');msg.textContent='';for(const f of [...inp.files]){if(c.hero.length>=MAXI){msg.textContent='Maximum '+MAXI+' images.';break}const u=await shrink(f,1000,.65);if(!u)continue;c.hero.push(u);if(JSON.stringify(c).length>900000){c.hero.pop();msg.textContent='Image too large. Use a smaller image.';break}}ch();$('himgs').innerHTML=heroMgr()}
function rmHero(i){const c=C();c.hero=(c.hero||[]).slice();c.hero.splice(i,1);ch();$('himgs').innerHTML=heroMgr()}
function store(){const c=C();return `<h2>Store details</h2><span class="mu">Logo</span><div>${c.logo?`<img src="${c.logo}" style="height:56px;border-radius:8px" alt="">`:'<span class="mu">No logo yet</span>'}</div><input type="file" accept="image/*" onchange="upLogo(this)">${c.logo?'<button class="btn o s" onclick="S.cfg.logo=\'\';ch();render()">Remove logo</button>':''}
<h2>Homepage banner images (up to ${MAXI})</h2><div id="himgs" class="th2">${heroMgr()}</div><div id="himsg" class="mu" style="color:#e03131"></div><div class="mu">They slide behind your headline on the home page.</div>
${fld('Store name','name',c)}${fld('Website link (e.g. www.yourshop.com)','web',c)}${fld('Instagram handle (optional)','ig',c)}${fld('Homepage headline','banner',c)}${fld('WhatsApp number for orders (with 91, no +)','wa',c)}`}

/* ===== v4: checkout screen, Razorpay, UPI apps, product table ===== */
let CK={pm:'',sh:'std',edit:false,n:'',ph:'',ad:'',pin:''};
try{const a=JSON.parse(localStorage.getItem('gn_addr'));if(a&&a.n)Object.assign(CK,a,{edit:false})}catch(e){}
const PSUB={upi:'Google Pay · PhonePe · Paytm · BHIM',card:'Visa · Mastercard · RuPay',nb:'All major banks',wallet:'Paytm · Mobikwik · Freecharge & more',cod:'Pay when your order arrives'};
const payOpts=()=>{const c=C();return ['upi','card','nb','wallet','cod'].filter(k=>(c.pay||{})[k]&&(k==='upi'||k==='cod'||c.rzpKey))};
function bill(){const c=C(),sub=subtotal(),m=CK.pm,ship=sub?shipFee(CK.sh):0,cod=m==='cod'?(+c.codFee||0):0,disc=m&&m!=='cod'?Math.min(+c.discOnline||0,sub):0,gst=Math.round((sub-disc)*(+c.gst||0)/100);return{sub,ship,cod,disc,gst,total:sub+ship+cod-disc+gst}}
const addrOk=()=>CK.n.trim()&&/^\d{10}$/.test(CK.ph.trim())&&CK.ad.trim()&&/^\d{6}$/.test(CK.pin.trim());
function openCart(){if(!Object.keys(cart).length){openP('<h2>Your cart</h2><p class="mu">Your cart is empty.</p><button class="btn o" style="width:100%" onclick="closeP()">Close</button>');return}checkout()}
function saveAddr(){const x=$('coerr');if(!addrOk()){x.textContent='Please fill name, 10-digit mobile, address and 6-digit pincode.';return}CK.edit=false;try{localStorage.setItem('gn_addr',JSON.stringify({n:CK.n,ph:CK.ph,ad:CK.ad,pin:CK.pin}))}catch(e){}checkout()}
function checkout(){const c=C(),opts=payOpts();if(!opts.includes(CK.pm))CK.pm=opts[0]||'';const b=bill(),e=Object.entries(cart),ok=addrOk()&&!CK.edit,online=CK.pm&&CK.pm!=='cod';
openP(`<div class="coh"><button class="bk" onclick="closeP()">←</button><b>Checkout</b></div>
<div class="cos"><div class="cot">📍 DELIVERY ADDRESS</div>${ok?`<div><b>${esc(CK.n)}</b><br>${esc(CK.ad)}<br>PIN ${esc(CK.pin)}<br>📞 ${esc(CK.ph)}</div><button class="lnk" onclick="CK.edit=true;checkout()">CHANGE</button>`:`<input placeholder="Full name" value="${esc(CK.n)}" oninput="CK.n=this.value"><input placeholder="Mobile number (10 digits)" inputmode="numeric" value="${esc(CK.ph)}" oninput="CK.ph=this.value"><input placeholder="House no, street, city, state" value="${esc(CK.ad)}" oninput="CK.ad=this.value"><input placeholder="Pincode (6 digits)" inputmode="numeric" value="${esc(CK.pin)}" oninput="CK.pin=this.value"><button class="btn s" onclick="saveAddr()">Save address</button>`}
<label class="pay"><input type="radio" name="sh" ${CK.sh==='std'?'checked':''} onchange="CK.sh='std';checkout()">🚚 Standard delivery (${shipFee('std')?inr(shipFee('std')):'FREE'})</label><label class="pay"><input type="radio" name="sh" ${CK.sh==='exp'?'checked':''} onchange="CK.sh='exp';checkout()">⚡ Express delivery (${inr(c.expFee)})</label></div>
<div class="cos"><div class="cot">🛒 YOUR CART</div>${e.map(([i,q])=>`<div class="row"><span>${esc(P(i).name)}<div class="mu">${inr(P(i).price)} each</div></span><span><button class="btn o s" onclick="qty(${i},-1)">−</button> ${q} <button class="btn o s" onclick="qty(${i},1)">+</button> <b>${inr(P(i).price*q)}</b></span></div>`).join('')}<button class="lnk" onclick="closeP()">+ Add more items</button></div>
<div class="cos"><div class="cot">💳 PAYMENT METHOD</div>${opts.map(k=>`<label class="pay"><input type="radio" name="pm" ${CK.pm===k?'checked':''} onchange="CK.pm='${k}';checkout()"><span><b>${PM[k]}</b><div class="mu">${PSUB[k]}${k==='cod'&&c.codFee?' (+'+inr(c.codFee)+' fee)':''}${k!=='cod'&&+c.discOnline?' · Save '+inr(c.discOnline):''}</div></span></label>`).join('')||'<p class="mu">No payment method is available right now.</p>'}</div>
<div class="cos" style="border:0"><div class="cot">BILL SUMMARY</div><div class="bl"><span>Item total</span><span>${inr(b.sub)}</span></div><div class="bl"><span>Delivery fee</span><span>${b.ship?inr(b.ship):'FREE'}</span></div>${b.cod?`<div class="bl"><span>COD fee</span><span>${inr(b.cod)}</span></div>`:''}${b.disc?`<div class="bl"><span>Discount</span><span>−${inr(b.disc)}</span></div>`:''}${b.gst?`<div class="bl"><span>GST (${+c.gst}%)</span><span>${inr(b.gst)}</span></div>`:''}<div class="bl t"><span>TOTAL</span><span>${inr(b.total)}</span></div></div>
<div id="coerr" class="mu" style="color:#e03131"></div><button class="btn" style="width:100%;margin-top:6px" ${opts.length?'':'disabled'} onclick="place()">${online?'PAY':'PLACE ORDER'} ${inr(b.total)}</button>${online&&c.rzpKey?'<div class="mu" style="text-align:center;margin-top:6px">🔒 Secure payment by Razorpay</div>':''}`)}
function loadRzp(){return new Promise((ok,no)=>{if(window.Razorpay)return ok();const s=document.createElement('script');s.src='https://checkout.razorpay.com/v1/checkout.js';s.onload=ok;s.onerror=()=>no(new Error('x'));document.head.appendChild(s)})}
async function rzpPay(T,id,m,fin,er){try{await loadRzp()}catch(e){return er('Could not open the payment window. Check your internet and try again.')}
const rz=new Razorpay({key:C().rzpKey,amount:Math.round(T*100),currency:'INR',name:C().name,description:'Order '+id,prefill:{name:CK.n,contact:CK.ph,method:{upi:'upi',card:'card',nb:'netbanking',wallet:'wallet'}[m]},notes:{order:id,address:CK.ad+' - '+CK.pin},theme:{color:'#d6336c'},handler:r=>fin(r.razorpay_payment_id),modal:{ondismiss:()=>er('Payment was cancelled. You can try again.')}});
rz.on('payment.failed',r=>er('Payment failed: '+((r.error&&r.error.description)||'please try again.')));rz.open()}
function recordOrder(o,msg,m,payId){if(FB){FBX.order(o,msg,m,payId);return}orders.unshift({id:o.id,date:new Date().toLocaleDateString('en-IN'),cust:o.cust,total:o.total,pay:m,items:o.items.map(i=>i.name+' x'+i.q).join(', ')});try{localStorage.setItem('gn_o',JSON.stringify(orders))}catch(e){}cart={};render();success(o.id,o.total,m,msg,payId)}
function place(){const er=m=>{const x=$('coerr');if(x)x.textContent=m};
if(!addrOk())return er('Please fill name, 10-digit mobile, address and 6-digit pincode.');if(!CK.pm)return er('Please choose a payment method.');
for(const [i,q] of Object.entries(cart)){const p=P(i);if(!p||p.off||q>p.stock)return er((p?p.name:'An item')+' is no longer available in that quantity.')}
try{localStorage.setItem('gn_addr',JSON.stringify({n:CK.n,ph:CK.ph,ad:CK.ad,pin:CK.pin}))}catch(e){}
const b=bill(),m=CK.pm,id='GN'+Date.now().toString().slice(-6),items=Object.entries(cart).map(([i,q])=>({id:+i,name:P(i).name,q,price:P(i).price,cost:0})),spd=CK.sh==='exp'?'Express':'Standard';
const msg=`New order ${id}\nItems: ${items.map(i=>i.name+' x'+i.q).join(', ')}\nTotal: ${inr(b.total)} (${PM[m]}, ${spd})\nName: ${CK.n}\nPhone: ${CK.ph}\nAddress: ${CK.ad} - ${CK.pin}`;
const o={id,type:'sale',d:today(),cust:CK.n.trim(),phone:CK.ph.trim(),disc:b.disc,ship:b.ship+b.cod+b.gst,gst:b.gst,ref:id,note:'',by:'Website',status:'Placed',items,mode:{upi:'UPI',card:'Card',nb:'Online',wallet:'Online',cod:'COD'}[m],total:b.total,paid:0,due:b.total};
const fin=pid=>{o.note='Website order ('+PM[m]+', '+spd+') '+CK.ad+' - '+CK.pin+(pid?' · Razorpay payment '+pid+' (verify in Razorpay dashboard, then press Paid)':'');if(pid)o.payId=pid;recordOrder(o,msg+(pid?'\nPayment ID: '+pid:''),m,pid)};
if(m!=='cod'&&C().rzpKey)rzpPay(b.total,id,m,fin,er);else fin('')}
function success(id,T,m,msg,payId){const c=C(),q=`pa=${encodeURIComponent(c.upiId||'')}&pn=${encodeURIComponent(c.name)}&am=${T}&cu=INR&tn=${id}`;
const upi=!payId&&m==='upi'&&c.upiId?`<div class="upis"><a class="btn s" href="tez://upi/pay?${q}">Google Pay</a><a class="btn s" href="phonepe://pay?${q}">PhonePe</a><a class="btn s" href="paytmmp://pay?${q}">Paytm</a><a class="btn s" href="upi://pay?${q}">Any UPI app</a></div><p class="mu">Pay ${inr(T)} to ${esc(c.upiId)} using one of these apps (works on your phone).</p>`:'';
openP(`<h2>🎉 Order placed!</h2><p>Order <b>${id}</b> · ${inr(T)}</p>${payId?`<p>✅ Payment received · ID <b>${esc(payId)}</b></p>`:''}${upi}<a class="btn wa" style="display:block;text-align:center;text-decoration:none;margin-top:8px" target="_blank" rel="noopener" href="https://wa.me/${c.wa}?text=${encodeURIComponent(msg)}">Send order on WhatsApp</a><p class="mu">${FB?'Your order has been recorded. Sharing it on WhatsApp is optional but speeds up confirmation.':'Please send the order message so we can confirm and ship it.'}</p>${FB?'<button class="btn o" style="width:100%;margin-bottom:6px" onclick="openTrack()">📦 Track this order</button>':''}<button class="btn o" style="width:100%" onclick="closeP()">Continue shopping</button>`)}
function pay(){const c=C();return `<h2>Payment modes shown at checkout</h2>${Object.keys(PM).map(k=>`<label class="pay"><input type="checkbox" ${(c.pay||{})[k]?'checked':''} onchange="S.cfg.pay.${k}=this.checked;ch()">${PM[k]}</label>`).join('')}
<h2>Razorpay (cards, net banking, wallets, UPI apps)</h2>${fld('Razorpay Key ID (rzp_test_… or rzp_live_…)','rzpKey',c)}<p class="mu">Card, Net Banking and Wallet appear at checkout only after you enter a Key ID. UPI then also runs through Razorpay (Google Pay, PhonePe, Paytm…). Never enter the Key Secret here.</p>
${fld('Your UPI ID (used for direct UPI when Razorpay is not set)','upiId',c)}${fld('GST % added on top (0 = prices already include GST)','gst',c,'number')}${fld('Discount for online payment ₹ (0 = none)','discOnline',c,'number')}`}
function prod(){return (can('prod_edit')?'<button class="btn" onclick="editP()">+ Add product</button>':'')+`<div class="tw"><table><tr><th></th><th>Name</th><th>Price</th><th>Stock</th><th>Photos</th><th>Description</th><th>Status</th><th></th></tr>${S.products.map(p=>`<tr style="${p.off?'opacity:.55':''}"><td>${imgOf(p)?`<img class="thumb" src="${imgOf(p)}" alt="">`:p.emoji}</td><td>${esc(p.name)}</td><td>${inr(p.price)}</td><td>${p.stock}</td><td>${imgsOf(p).length}/${MAXI}</td><td>${p.desc?'✅ Added':(can('prod_edit')?`<a href="#" onclick="editP(${p.id});return false">+ Add</a>`:'—')}</td><td>${p.off?'Inactive':'Active'}</td><td>${can('prod_edit')?`<button class="btn o s" onclick="editP(${p.id})">Edit</button> `:''}${can('prod_status')?`<button class="btn o s" onclick="toggleP(${p.id})">${p.off?'Activate':'Deactivate'}</button>`:''}</td></tr>`).join('')}</table></div><p class="mu">Press <b>Edit</b> to add up to 5 photos and the <b>Description</b> customers read below the photo when they open an item. Items cannot be deleted — deactivate them instead.</p>`}

/* ===== v5: order tracking, order status, WhatsApp updates ===== */
const STEPS=['Placed','Confirmed','Packed','Shipped','Delivered'],OST=[...STEPS,'Cancelled'];
let MY=[],TU=[];try{MY=JSON.parse(localStorage.getItem('gn_my'))||[]}catch(e){}
function myAdd(id,ph){MY=[{id,ph},...MY.filter(x=>x.id!==id)].slice(0,10);try{localStorage.setItem('gn_my',JSON.stringify(MY))}catch(e){}}
function tlHtml(d){if(!d)return '<p class="mu">Order not found.</p>';const h=d.hist||[],when=s=>{const x=[...h].reverse().find(y=>y.s===s);return x?new Date(x.t).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'}):''};
const info=`<p class="mu">${esc(d.items||'')} · ${inr(d.total||0)}</p>`;
if(d.status==='Cancelled')return `<div class="trk bad">❌ Order cancelled</div>${info}`;
const cur=STEPS.indexOf(d.status);

async function pushAll(){
  // Manual-save only: write the current settings when they changed.
  const cj=sj({cfg:S.cfg,sections:S.sections});
  if(cj!==lastC){
    if(cj.length>950000)throw Error('Banner / logo images are too big. Remove one banner image.');
    await setDoc(doc(db,'config','shop'),clean({cfg:S.cfg,sections:S.sections}));
    lastC=cj;
  }

  // Manual-save only: write the current product state to Firestore.
  // We deliberately do not skip based on lastJ; this prevents stale local
  // snapshots from causing an edited value to be skipped.
  for(const p of S.products){
    const d=clean(p);
    const withStock=!!p._st || !(p.id in RPM);

    delete d._st;

    if(!withStock)delete d.stock;

    if(JSON.stringify(d).length>950000)
      throw Error(p.name+': photos are too big for one item. Remove a photo.');

    const r=RPM[p.id]||{};

const RULES_TPL="rules_version = '2';\nservice cloud.firestore {\n  match /databases/{database}/documents {\n\n    // Admin = the email below (must be the account you created in Firebase > Authentication)\n    function isAdmin() {\n      return request.auth != null && request.auth.token.email.lower() == '__EMAIL__';\n    }\n    function isStaff() {\n      return isAdmin() || (request.auth != null\n        && exists(/databases/$(database)/documents/staff/$(request.auth.token.email.lower()))\n        && get(/databases/$(database)/documents/staff/$(request.auth.token.email.lower())).data.active == true);\n    }\n\n    // Shop settings, banner images, headings: everyone reads, only staff/admin write\n    match /config/{doc} {\n      allow read: if true;\n      allow write: if isStaff();\n    }\n\n    // Products: everyone reads. Customers may ONLY lower the stock number (when they order).\n    match /products/{id} {\n      allow read: if true;\n      allow create, delete: if isStaff();\n      allow update: if isStaff() || (\n        request.resource.data.diff(resource.data).affectedKeys().hasOnly(['stock'])\n        && request.resource.data.stock >= 0\n        && request.resource.data.stock < resource.data.stock);\n    }\n\n    // Sales / purchases / wastage: only staff can read. Customers may only create a website order.\n    match /entries/{id} {\n      allow read, update, delete: if isStaff();\n      allow create: if isStaff() || (\n        request.resource.data.type == 'sale'\n        && request.resource.data.by == 'Website'\n        && request.resource.data.paid == 0\n        && request.resource.data.items.size() > 0\n        && request.resource.data.items.size() <= 20);\n    }\n\n    // Order tracking: a customer can read ONE order if they know its ID (no browsing the list).\n    match /tracks/{id} {\n      allow get: if true;\n      allow list: if isStaff();\n      allow create: if isStaff() || (\n        request.resource.data.status == 'Placed'\n        && request.resource.data.keys().hasOnly(['status','ph','d','items','total','hist']));\n      allow update, delete: if isStaff();\n    }\n\n    // Used by the in-app Setup check to confirm the latest rules are published\n    match /rulesprobe/{id} {\n      allow get: if id == 'v6';\n    }\n\n    // Daily visitor counter: anyone may add exactly +1\n    match /visits/{day} {\n      allow read: if isStaff();\n      allow create: if request.resource.data.keys().hasOnly(['count']) && request.resource.data.count == 1;\n      allow update: if isStaff() || (\n        request.resource.data.keys().hasOnly(['count'])\n        && request.resource.data.count == resource.data.count + 1);\n    }\n\n    // Staff accounts: only admin manages; a staff member can read their own record\n    match /staff/{email} {\n      allow read: if isAdmin() || (request.auth != null && request.auth.token.email.lower() == email);\n      allow write: if isAdmin();\n    }\n  }\n}\n";

window.users=()=>`<p class="mu">Add staff here. They log in with their email and password and only get the rights you tick.</p><button class="btn" onclick="editU()">+ Add user</button><div class="tw"><table><tr><th>Name</th><th>Email</th><th>Status</th><th></th></tr>${STAFF.map(u=>`<tr style="${u.active===false?'opacity:.55':''}"><td>${esc(u.name||'')}</td><td>${esc(u.email)}</td><td>${u.active===false?'Inactive':'Active'}</td><td><button class="btn o s" onclick="editU('${u.email}')">Rights</button> <button class="btn o s" onclick="toggleU('${u.email}')">${u.active===false?'Activate':'Deactivate'}</button> <button class="btn o s" onclick="resetPw('${u.email}')">Reset password</button></td></tr>`).join('')||'<tr><td colspan=4 class="mu">No staff yet.</td></tr>'}</table></div><h2>Admin login</h2><p class="mu">Admin email: ${esc(ADMIN_EMAIL)}</p><button class="btn o" onclick="resetPw('${ADMIN_EMAIL}')">Send admin password-reset email</button>`;
window.editU=em=>{const u=em?STAFF.find(x=>x.email===em):{name:'',email:'',rights:{},isNew:1};UE=u;
  openP(`<h2>${em?'Edit':'New'} user</h2><span class="mu">Name</span><input id="u_n" value="${esc(u.name||'')}"><span class="mu">Email (their login)</span><input id="u_u" type="email" value="${esc(u.email||'')}" ${em?'readonly':''} autocapitalize="none">${em?'':'<span class="mu">Password (min 6 characters)</span><input id="u_p" type="password" autocomplete="new-password">'}<h2>Rights</h2>${RIGHTS.map(([k,l])=>`<label class="pay"><input type="checkbox" id="r_${k}" ${(u.rights||{})[k]?'checked':''}>${l}</label>`).join('')}<div id="uerr" class="mu" style="color:#e03131"></div><button class="btn" style="width:100%" onclick="saveU()">Save user</button><button class="btn o" style="width:100%;margin-top:6px" onclick="closeP()">Cancel</button>`)};
window.saveU=async()=>{const E1=m=>{$('uerr').textContent=m},n=$('u_n').value.trim(),em=$('u_u').value.trim().toLowerCase(),pw=$('u_p')?$('u_p').value:'';
  if(!n||!/^\S+@\S+\.\S+$/.test(em))return E1('Enter a name and a valid email.');if(em===AE)return E1('That is the admin email.');
  const rights={};RIGHTS.forEach(([k])=>{if($('r_'+k).checked)rights[k]=1});
  try{if(UE.isNew){if(pw.length<6)return E1('Password must be at least 6 characters.');
      const sec=initializeApp(firebaseConfig,'sec'+Date.now()),sa=getAuth(sec);try{await createUserWithEmailAndPassword(sa,em,pw)}catch(e){if(e.code!=='auth/email-already-in-use')throw e}await signOut(sa);
      await setDoc(doc(db,'staff',em),{name:n,rights,active:true})}
    else await setDoc(doc(db,'staff',em),{name:n,rights},{merge:true});
    closeP()}catch(e){E1(e.code||e.message)}};
window.toggleU=async em=>{const u=STAFF.find(x=>x.email===em);if(u)try{await updateDoc(doc(db,'staff',em),{active:u.active===false})}catch(e){alert(e.code||e.message)}};
window.resetPw=async em=>{try{await sendPasswordResetEmail(auth,em);alert('Password-reset email sent to '+em)}catch(e){alert(e.code||e.message)}};
</script>
</body>
</html>
